# 数据源自动配置：容器启动即可用，不需要手动在 UI 里添加。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # 固定 uid：dashboard JSON 里按这个 uid 引用数据源，导入即生效。
    uid: PROMETHEUS
    access: proxy
    # compose 网络内的服务名 + 容器端口
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 与 prometheus.yml 的 scrape_interval 保持一致，Grafana 才能推荐正确的步长
      timeInterval: 15s
      httpMethod: POST
